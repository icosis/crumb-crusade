<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Crumb Crusade</title>
<style>
  /* no blue tap flash / text selection / long-press menu on phones */
  * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  textarea { -webkit-user-select: text; user-select: text; }   /* the save-code box still needs to be selectable */
  html, body { margin: 0; height: 100%; background: #1b1410; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none;
           box-shadow: 0 10px 50px rgba(0,0,0,.6); border-radius: 6px; cursor: default; }
  #out { position: fixed; left: 0; top: 0; color: #fff; font: 12px monospace; white-space: pre; }
  /* "turn your phone sideways": only on a narrow screen held upright; "Play anyway" hides it */
  #rot { display: none; position: fixed; inset: 0; z-index: 300; background: #1b1410; color: #fff3d6; font: 20px sans-serif; text-align: center;
         flex-direction: column; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
  #rot .ph { width: 64px; height: 108px; border: 6px solid #f6b93b; border-radius: 14px; margin-bottom: 26px; animation: rotphone 2.4s ease-in-out infinite; }
  #rot button { margin-top: 26px; font: bold 17px sans-serif; padding: 12px 22px; border-radius: 12px; border: 0; background: #f6b93b; color: #3a2416; }
  @keyframes rotphone { 0%, 25% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (max-width: 900px) { #rot { display: flex; } }
  html.rotok #rot { display: none !important; }
</style>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<canvas id="game" width="1280" height="720"></canvas>

<div id="rot"><div class="ph"></div><div>Turn your phone sideways to play</div><button id="rotok" type="button">Play anyway</button></div>

document.getElementById('rotok').onclick = function () { document.documentElement.className += ' rotok'; };

document.addEventListener('pointerdown', function () { try { screen.orientation.lock('landscape').catch(function () {}); } catch (e) {} }, { once: true });
</script>
